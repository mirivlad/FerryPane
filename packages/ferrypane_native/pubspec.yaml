name: ferrypane_native
description: Native Android personal-data and LAN bridges registered in all Flutter engines.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: top.mirv.ferrypane
        pluginClass: FerryPaneNativePlugin
