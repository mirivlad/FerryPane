name: Build FerryPane 0.1.0 preview
on:
  push:
    branches: [main, feat/lan-mvp]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Prepare Flutter platforms
        run: bash tool/prepare_platforms.sh
      - name: Check project
        run: |
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build Linux
        run: flutter build linux --release
      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/FerryPane-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: FerryPane-linux-x64
          path: FerryPane-linux-x64.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: FerryPane-linux-x64.tar.gz
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platforms
        shell: bash
        run: bash tool/prepare_platforms.sh
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath FerryPane-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FerryPane-windows-x64
          path: FerryPane-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: FerryPane-windows-x64.zip
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platforms
        run: bash tool/prepare_platforms.sh
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Package APK
        run: cp build/app/outputs/flutter-apk/app-release.apk FerryPane-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FerryPane-android-apk
          path: FerryPane-android.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: FerryPane-android.apk
