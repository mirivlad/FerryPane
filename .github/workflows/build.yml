name: Build FerryPane
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Prepare Flutter platforms
        run: bash tool/prepare_platforms.sh
      - name: Check project
        run: |
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build Linux
        run: flutter build linux --release
      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/FerryPane-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: FerryPane-linux-x64
          path: FerryPane-linux-x64.tar.gz
          if-no-files-found: error
      - name: Build Debian installer
        run: |
          bash tool/build_deb.sh "$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          dpkg-deb --field FerryPane-linux-amd64.deb Package Version Architecture
      - uses: actions/upload-artifact@v4
        with:
          name: FerryPane-linux-deb
          path: FerryPane-linux-amd64.deb
          if-no-files-found: error
      - name: Smoke-test Debian installation
        run: |
          sudo apt-get install -y ./FerryPane-linux-amd64.deb
          test -x /opt/ferrypane/ferrypane
          test -f /usr/share/applications/ferrypane.desktop
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platforms
        shell: bash
        run: bash tool/prepare_platforms.sh
      - name: Build Windows
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath FerryPane-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FerryPane-windows-x64
          path: FerryPane-windows-x64.zip
          if-no-files-found: error
      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis --no-progress -y }
          if (!(Test-Path $nsis)) { throw "NSIS not found" }
      - name: Build Windows setup EXE
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          $source = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $version = ((Get-Content pubspec.yaml | Select-String '^version: (.+?)\+').Matches.Groups[1].Value)
          & $nsis "/DAPP_SOURCE=$source" "/DAPP_VERSION=$version" "tool/windows/FerryPane.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer failed" }
          Copy-Item -LiteralPath 'tool/windows/FerryPane-windows-x64-setup.exe' -Destination 'FerryPane-windows-x64-setup.exe'
          if (!(Test-Path 'FerryPane-windows-x64-setup.exe')) { throw "Installer artifact not found" }
      - uses: actions/upload-artifact@v4
        with:
          name: FerryPane-windows-installer
          path: FerryPane-windows-x64-setup.exe
          if-no-files-found: error
      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'FerryPane-windows-x64-setup.exe').Path
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\FerryPane\ferrypane.exe'
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS exit code: $($process.ExitCode)" }
          if (!(Test-Path $installed)) { throw "NSIS setup failed to install ferrypane.exe" }
          if (!(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\FerryPane\Uninstall.exe'))) { throw "NSIS uninstaller missing" }
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter platforms
        run: bash tool/prepare_platforms.sh
      # Untagged builds (PR/main) validate code with debug signing only.
      # Tagged releases require the permanent private signing key.
      - name: Validate Android APK (non-release builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: flutter build apk --debug --target-platform android-arm64
      - name: Configure permanent Android signing identity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          FERRYPANE_ANDROID_KEYSTORE_B64: ${{ secrets.FERRYPANE_ANDROID_KEYSTORE_B64 }}
          FERRYPANE_ANDROID_STORE_PASSWORD: ${{ secrets.FERRYPANE_ANDROID_STORE_PASSWORD }}
        run: bash tool/prepare_signing.sh
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Verify signed APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          actual="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | awk -F 'digest: ' '/certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual" != "20BD4749485E7C1A5C0EF072077E277FEABD2389E31161B675B4FDDB7407439D" ]]; then
            echo "::error::APK signer certificate fingerprint does not match FerryPane release identity"
            exit 1
          fi
      - name: Package APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp build/app/outputs/flutter-apk/app-release.apk FerryPane-android.apk
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: FerryPane-android-apk
          path: FerryPane-android.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FerryPane-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          name: FerryPane 0.1.6 Preview
          prerelease: true
          generate_release_notes: true
          files: |
            FerryPane-linux-x64.tar.gz
            FerryPane-linux-amd64.deb
            FerryPane-windows-x64.zip
            FerryPane-windows-x64-setup.exe
            FerryPane-android.apk
