name: ferrypane
description: Local-first peer-to-peer file manager for Windows, Linux and Android.
publish_to: none
version: 0.1.5+6

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.3
  convert: ^3.1.1
  shared_preferences: ^2.3.2
  path: ^1.9.0
  permission_handler: ^12.0.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
